name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build library
        run: bun run build
      - name: Smoke built package
        run: bun run test:dist
      - name: Build studio
        run: bun run build:studio
      - name: Build docs
        run: bun run docs:build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1.
      - name: Use an OIDC-capable npm
        run: npm install -g npm@^11.5.1
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          root="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$root" = "$tag" || { echo "tag '$tag' != package version '$root'"; exit 1; }
      # Trusted publishing (OIDC): configure the trusted publisher on npmjs.com.
      # NPM_TOKEN is optional fallback when a trusted publisher is not set.
      - name: Publish images-in-motion to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "images-in-motion@${version}" version >/dev/null 2>&1; then
            echo "images-in-motion@${version} is already on npm"
            exit 0
          fi
          npm publish --access public
