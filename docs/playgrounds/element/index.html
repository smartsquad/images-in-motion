<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Images in motion (custom element)</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #141313;
      }

      images-in-motion {
        display: block;
        width: min(480px, 100vw);
        aspect-ratio: 3 / 4;
      }
    </style>
  </head>
  <body>
    <images-in-motion angle="12" speed-range="[8,18]"></images-in-motion>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
